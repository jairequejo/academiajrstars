<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>JR Stars — Scanner</title>

    <link rel="manifest" href="/scanner/manifest.json">
    <meta name="theme-color" content="#da1212">
    <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon-scanner.ico" type="image/x-icon">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/scanner/sw.js', { scope: '/scanner' })
                .then(reg => {
                    reg.update();
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage('SKIP_WAITING');
                            }
                        });
                    });
                })
                .catch(err => console.warn('[SW] Error:', err));

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                location.reload();
            });
        }
    </script>
</head>

<body>
    <div id="flash-bg"></div>

    <div class="kiosko-layout">
        <div class="left-panel">
            <div class="brand">
                <img src="/img/escudo.png" alt="JR Stars"
                    style="width:60px;height:60px;object-fit:contain;"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <div class="brand-logo" style="display:none">JR★</div>
                <div class="brand-name">STARS</div>
                <div class="brand-sub">Academia</div>
            </div>
            <div class="brand-divider"></div>
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date-display"></div>
            <div class="brand-divider"></div>
            <div class="status-idle" id="status-text">Acerca tu medallón</div>
            <div class="nfc-indicator" id="nfc-indicator">
                <div class="nfc-icon">📡</div>
                <span class="nfc-label">NFC Activo</span>
            </div>
        </div>

        <div class="right-panel" id="right-panel">
            <div class="start-screen" id="start-screen">
                <div class="start-icon">📷</div>
                <div class="start-title">TOCA PARA ACTIVAR</div>
                <div class="start-sub">Se necesita permiso de cámara</div>
            </div>
            <div class="scanner-frame" id="scanner-frame" style="display:none">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <div id="reader"></div>
                <div class="scan-line"></div>
            </div>
        </div>
    </div>

    <div class="result-overlay" id="result-overlay">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-name" id="result-name"></div>
        <div class="result-msg" id="result-msg"></div>
    </div>

    <div class="history-strip" id="history-strip"></div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        (function () {
            var s = document.createElement('script');
            s.src = '/js/scanner.js?_=' + Date.now();
            document.body.appendChild(s);
        })();
    </script>

    <div id="pin-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(17,17,17,0.6);align-items:center;justify-content:center;font-family:'IBM Plex Mono',system-ui,sans-serif;">
        <div style="background:#ffffff;border:2px solid #111111;border-bottom:4px solid #da1212;padding:2rem;width:300px;text-align:center;color:#111111;box-shadow:0 20px 40px rgba(0,0,0,0.15);position:relative;">
            <!-- Barra roja izquierda — firma visual -->
            <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#da1212;"></div>
            <div style="font-size:2rem;margin-bottom:.5rem">🔐</div>
            <div style="font-family:'Bebas Neue',Impact,sans-serif;font-size:1.8rem;letter-spacing:0.08em;color:#111111;margin-bottom:.75rem;text-transform:uppercase;">Acceso Scanner</div>
            <div id="pin-dots" style="font-size:1.8rem;letter-spacing:.6rem;color:#da1212;min-height:2.2rem;margin-bottom:.4rem;font-family:'IBM Plex Mono',monospace;">○ ○ ○ ○</div>
            <div id="pin-err" style="color:#da1212;font-size:.82rem;min-height:1.1rem;margin-bottom:.5rem;font-family:'IBM Plex Mono',monospace;letter-spacing:0.05em;"></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem">
                <button class="pbn" onclick="pinKey('1')">1</button>
                <button class="pbn" onclick="pinKey('2')">2</button>
                <button class="pbn" onclick="pinKey('3')">3</button>
                <button class="pbn" onclick="pinKey('4')">4</button>
                <button class="pbn" onclick="pinKey('5')">5</button>
                <button class="pbn" onclick="pinKey('6')">6</button>
                <button class="pbn" onclick="pinKey('7')">7</button>
                <button class="pbn" onclick="pinKey('8')">8</button>
                <button class="pbn" onclick="pinKey('9')">9</button>
                <button class="pbn" onclick="pinKey('DEL')" style="color:#da1212;border-color:#da1212;">⌫</button>
                <button class="pbn" onclick="pinKey('0')">0</button>
                <button class="pbn" onclick="pinSubmit()" style="background:#da1212;color:#fff;border-color:#da1212;font-weight:700;">✓</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabaseClient.js"></script>
</body>
</html>
