<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JR Stars — Acceso Entrenador</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="icon" href="/favicon-entrenador.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabaseClient.js"></script>
</head>

<body>
    <div class="access-box">
        <div class="access-logo">
            <img src="/img/logo.png" alt="logo" onload="this.classList.add('loaded')">
            <span>🏃</span>
        </div>
        <div class="access-title">JR <span>STARS</span></div>
        <div class="access-sub">// Panel Entrenador</div>

        <div class="spinner" id="spinner"></div>
        <div class="status-msg" id="status-msg">Verificando acceso...</div>
        <div class="no-access" id="no-access">
            Este enlace es inválido o fue revocado.<br>
            Solicita un nuevo acceso al administrador.
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>

</html>
