<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JR Stars — Acceso Entrenador</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" href="../img/escudo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
</head>

<body>
    <main class="access-box">

        <!-- Logo centrado -->
        <div class="access-logo">
            <img src="../img/escudo.png" alt="Escudo JR Stars"
                onload="this.classList.add('loaded')"
                onerror="this.style.display='none'">
            <span>🏃</span>
        </div>

        <h1 class="access-title">JR <span>STARS</span></h1>
        <h2 class="access-sub">Panel Entrenador</h2>

        <!-- Spinner de verificación -->
        <div class="spinner" id="spinner"></div>
        <p class="status-msg" id="status-msg">Verificando acceso...</p>

        <!-- Mensaje de error / acceso denegado -->
        <p class="no-access" id="no-access">
            Este enlace es inválido o fue revocado.<br>
            Solicita un nuevo acceso al administrador.
        </p>

    </main>

    <script src="../js/login.js"></script>
</body>

</html>
