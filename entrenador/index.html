<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JR Stars — Panel Entrenador</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/entrenador.css">
    <link rel="icon" href="../img/escudo.png" type="image/png">
    <style>
        /* Clases utilitarias inline — alineadas al nuevo tema light */
        .logo-escudo { width: 40px; height: auto; }
        .flex-wrap { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .select-filter { font-size: 0.82rem; padding: 0.35rem 0.6rem; width: auto; }
        .input-search  { font-size: 0.82rem; padding: 0.35rem 0.6rem; max-width: 160px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <a href="../" class="topbar-brand">
            <div class="topbar-logo-circle">
                <img src="../img/escudo.png" alt="logo escudo jr stars" class="logo-escudo" onerror="this.style.display='none'">
            </div>
            <span class="topbar-name">JR <span>STARS</span></span>
        </a>
        <div class="topbar-right">
            <span class="offline-badge" id="offline-badge"></span>
            <span class="topbar-role-badge">🏃 Entrenador</span>
            <span class="topbar-email" id="coach-email"></span>
        </div>
    </header>

    <!-- OVERLAY FLASH DE PANTALLA COMPLETA -->
    <div class="flash-overlay" id="flash-overlay">
        <div class="flash-icon" id="flash-icon"></div>
        <div class="flash-name" id="flash-name"></div>
        <div class="flash-status" id="flash-status"></div>
        <div class="flash-detalle" id="flash-detalle"></div>
        <div class="flash-bar" id="flash-bar"></div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="coach-layout">

        <!-- ── TAB: SCANNER ── -->
        <section class="tab-page active" id="tab-scanner">
            <header class="page-header">
                <h1 class="page-title">📷 <span>Scanner</span></h1>
                <div class="nfc-badge" id="nfc-badge">NFC</div>
            </header>

            <article class="scanner-wrap">
                <div class="scanner-box">
                    <div id="reader"></div>
                    <p class="scan-hint">Acerca el QR o medallón NFC del alumno</p>
                </div>
                <aside class="scan-history-panel">
                    <h2 class="history-title">ÚLTIMOS REGISTROS</h2>
                    <ul id="scan-history"></ul>
                </aside>
            </article>
        </section>

        <!-- ── TAB: ASISTENCIA ── -->
        <section class="tab-page" id="tab-asistencia">
            <header class="page-header">
                <h1 class="page-title">📋 <span>Asistencia Hoy</span></h1>
                <button class="btn btn-outline" onclick="loadAsistencia()">⟳ Actualizar</button>
            </header>

            <div class="asistencia-stats" id="asistencia-stats"></div>

            <nav class="asistencia-filtros">
                <button class="chip active" id="chip-todos"     onclick="setFiltroAsist('todos', this)">Todos</button>
                <button class="chip"         id="chip-presentes" onclick="setFiltroAsist('presentes', this)">✅ Presentes</button>
                <button class="chip"         id="chip-ausentes"  onclick="setFiltroAsist('ausentes', this)">❌ Ausentes</button>
                <button class="chip chip-rojo" id="chip-deudores" onclick="setFiltroAsist('deudores', this)">⚠️ Deben</button>
            </nav>

            <!-- Filtros de Sede y Grupo -->
            <nav class="asistencia-filtros flex-wrap">
                <select id="filtro-ent-turno" class="input-jr select-jr select-filter" onchange="renderAsistencia()">
                    <option value="">Todos los turnos</option>
                    <option value="mañana">Mañana</option>
                    <option value="tarde">Tarde</option>
                </select>
                <select id="filtro-ent-sede" class="input-jr select-jr select-filter" onchange="renderAsistencia()">
                    <option value="">Todas las sedes</option>
                    <option value="El Bosque">El Bosque</option>
                    <option value="Centro">Centro</option>
                    <option value="Norte">Norte</option>
                    <option value="Sur">Sur</option>
                </select>
                <select id="filtro-ent-grupo" class="input-jr select-jr select-filter" onchange="renderAsistencia()">
                    <option value="">Todos los grupos</option>
                    <option value="A">Grupo A</option>
                    <option value="B">Grupo B</option>
                    <option value="C">Grupo C</option>
                    <option value="D">Grupo D</option>
                    <option value="E">Grupo E</option>
                </select>
                <input type="text" id="filtro-ent-nombre" class="input-jr input-search"
                    placeholder="🔍 Buscar nombre..." oninput="renderAsistencia()">
            </nav>

            <div id="asistencia-list">
                <p class="loading-msg">Cargando...</p>
            </div>
        </section>
    </main>

    <!-- MODAL DE BIOMETRÍA -->
    <div id="modal-biometria" class="flash-overlay modal-brutal-overlay">
        <article class="modal-brutal-box">
            <button onclick="document.getElementById('modal-biometria').classList.remove('show')" class="btn-close">✕</button>
            <h2 class="modal-title" id="bio-student-name">ALUMNO</h2>
            <p class="modal-subtitle">Registrar Pruebas Físicas</p>

            <input type="hidden" id="bio-student-id">

            <label class="brutal-label" for="bio-talla">Estatura (m)</label>
            <input type="number" step="0.01" id="bio-talla" class="input-jr input-brutal">

            <label class="brutal-label" for="bio-peso">Peso (kg)</label>
            <input type="number" step="0.1" id="bio-peso" class="input-jr input-brutal">

            <label class="brutal-label" for="bio-sprint">Sprint 20m (Segundos)</label>
            <input type="number" step="0.01" id="bio-sprint" class="input-jr input-brutal">

            <button class="btn-gold" onclick="guardarBiometria()">GUARDAR REGISTRO</button>
        </article>
    </div>

    <!-- NAV INFERIOR -->
    <nav class="bottom-nav">
        <button class="bnav-btn active" id="bnav-scanner" onclick="goTab('scanner', this)">
            <span>📷</span><span class="bnav-label">Scanner</span>
        </button>
        <button class="bnav-btn" id="bnav-asistencia" onclick="goTab('asistencia', this)">
            <span>📋</span><span class="bnav-label">Asistencia</span>
        </button>
    </nav>

    <script src="../js/entrenador.js"></script>
</body>

</html>
