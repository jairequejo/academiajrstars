<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JR Stars — Admin</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="icon" href="/favicon-admin.ico" type="image/x-icon">
  <link rel="icon" href="/favicon-admin.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-box">
    <div class="login-brand">
      <div class="login-logo">
        <img src="/img/escudo.png" alt="logo" style="width: 50px; height: auto; filter: drop-shadow(0 0 8px var(--red-glow));">
      </div>
      <div class="login-title">JR <span>STARS</span></div>
    </div>

    <span class="login-tag">Sports Analytics Portal</span>

    <div class="login-error" id="login-error">❌ Correo o contraseña incorrectos</div>

    <div class="form-group">
      <label class="form-label">Correo</label>
      <input class="input-jr" type="email" id="email"
        placeholder="admin@jrstars.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input class="input-jr" type="password" id="password"
        placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login" onclick="login()">AUTHORIZE ACCESS</button>

    <div class="login-footer">System Restricted Area</div>
  </div>

<script>
  // Si ya tiene token válido, redirigir directo
  const token = localStorage.getItem('jr_admin_token');
  if (token) window.location.href = '/admin/index.html';

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const errDiv   = document.getElementById('login-error');

    if (!email || !password) return;

    btn.disabled = true;
    btn.textContent = 'VERIFICANDO...';
    errDiv.classList.remove('visible');

    try {
      const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;

      localStorage.setItem('jr_admin_token', data.session.access_token);
      localStorage.setItem('jr_admin_email', data.user.email);
      window.location.href = '/admin/index.html';

    } catch (e) {
      console.error(e);
      errDiv.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'ENTRAR AL PANEL';
    }
  }

  // Enter para login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
