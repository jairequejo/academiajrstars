<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow, noarchive"/>
  <title>JR Stars — Acceso Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN -->
  
  

  <style>
    body {
      background-color: #050505;
      color: #FFFFFF;
    }

    .slant-btn {
      transform: skewX(-10deg);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .slant-btn-content {
      display: block;
      transform: skewX(10deg);
    }
    .slant-btn:hover {
      box-shadow: 0 0 25px rgba(229, 25, 27, 0.5);
      transform: skewX(-10deg) scale(1.02);
    }

    .bento-card {
      background-color: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 1.5rem;
    }

    /* Ambient Background Effects */
    .bg-ambient-layer1 {
      position: absolute; inset: 0; z-index: 10;
      background: linear-gradient(to top, #050505, transparent, transparent);
    }
    .bg-ambient-layer2 {
      position: absolute;
      top: -20%; left: 50%;
      transform: translateX(-50%);
      width: 400px; height: 400px;
      background-color: #e5191b; /* var(--brand) */
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
    }
  </style>

  <meta name="theme-color" content="#E30D13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JR Admin">
  <link rel="icon" href="../img/favicons/favicon-admin.ico" type="image/x-icon">
  <link rel="icon" href="./icons/red-white/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icons/red-white/apple-touch-icon-admin.png" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
  <script src="../js/supabaseClient.js"></script>
  <link rel="stylesheet" href="../css/admin-icons.css?v=20260904">
  <link rel="stylesheet" href="../css/tailwind.css">
</head>
<body class="min-h-screen flex items-center justify-center font-body antialiased selection:bg-brand selection:text-white p-4 relative overflow-hidden">

  <!-- Background Ambient -->
  <div class="absolute inset-0 z-0">
    <div class="bg-ambient-layer1"></div>
    <div class="bg-ambient-layer2"></div>
  </div>

  <div class="bento-card w-full max-w-md p-5 sm:p-10 relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.5)]">

    <!-- BRAND -->
    <div class="flex flex-col items-center text-center mb-8">
      <img src="../img/escudo.png" alt="Escudo JR Stars" class="w-24 h-24 drop-shadow-[0_0_20px_rgba(229,25,27,0.3)] mb-4" onerror="this.onerror=null;this.style.display='none'">
      <div class="font-display text-5xl italic tracking-wider leading-none">JR <span class="text-brand">STARS</span></div>
      <div class="inline-block bg-white/5 border border-white/10 text-gray-400 font-bold text-[0.65rem] uppercase tracking-widest px-3 py-1 rounded-full mt-4">
        Panel de Administración
      </div>
    </div>

    <!-- ERROR -->
    <div id="login-error" class="hidden bg-brand/10 border border-brand/30 text-brand text-sm font-bold uppercase tracking-wide rounded-lg p-4 mb-6 text-center">
      <svg class="admin-icon" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="../img/admin-icons.svg#error"></use></svg> Correo o contraseña incorrectos
    </div>

    <!-- FORM -->
    <div class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2" for="email">Correo electrónico</label>
        <input class="w-full bg-[#111] border border-white/20 rounded-xl text-white font-body px-4 py-3 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder:text-gray-600 transition-all" type="email" id="email" placeholder="admin@jrstars.com" autocomplete="email">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2" for="password">Contraseña</label>
        <input class="w-full bg-[#111] border border-white/20 rounded-xl text-white font-body px-4 py-3 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder:text-gray-600 transition-all" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button id="btn-login" onclick="login()" class="slant-btn w-full bg-brand text-white mt-8 py-4 border border-transparent">
        <span class="slant-btn-content font-display text-2xl uppercase tracking-wider">INGRESAR AL PANEL</span>
      </button>
    </div>

    <div class="mt-8 text-center text-xs font-medium text-gray-600 uppercase tracking-widest">
      Área restringida · Solo personal autorizado
    </div>

  </div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(error => {
      console.warn('PWA de administración no disponible:', error.message);
    });
  }

  // Supabase conserva y renueva la sesión; no duplicamos el access token manualmente.
  window.supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.replace('index.html');
  });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const errDiv   = document.getElementById('login-error');

    if (!email || !password) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="slant-btn-content font-display text-2xl uppercase tracking-wider">VERIFICANDO...</span>';
    errDiv.classList.add('hidden');

    try {
      if (!window.supabaseClient) throw new Error("Supabase no cargó");
      const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;

      window.location.replace('index.html');

    } catch (e) {
      console.error(e);
      errDiv.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<span class="slant-btn-content font-display text-2xl uppercase tracking-wider">INGRESAR AL PANEL</span>';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
