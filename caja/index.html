<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Caja — JR Stars</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/caja.css">
  <link rel="icon" href="../img/favicons/favicon-caja.ico" type="image/x-icon">
</head>

<body>

  <!-- ── PIN SCREEN ── -->
  <section class="pin-screen" id="pin-screen">
    <h1 class="pin-title">PIN DE CAJA</h1>
    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn btn-borrar" onclick="clearPin()">BORRAR</button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
    </div>
  </section>

  <!-- ── CAJA LAYOUT ── -->
  <main class="caja-layout" id="caja-layout">

    <!-- Topbar con escudo + nombre + badge -->
    <header class="caja-header" id="caja-header-topbar">
      <div class="caja-topbar-brand">
        <img src="../img/escudo.png" alt="JR Stars" onerror="this.style.display='none'">
        <span class="caja-topbar-name">JR STARS</span>
        <span class="caja-topbar-badge">Caja</span>
      </div>
      <div id="reader-container">
        <div id="reader"></div>
      </div>
      <p class="status-nfc" id="status-nfc">📡 Esperando NFC o QR...</p>
    </header>

    <!-- Datos del cliente escaneado -->
    <section class="cliente-box" id="cliente-box">
      <h2 class="c-nombre" id="c-nombre">JUAN PÉREZ</h2>
      <p class="c-creditos">Créditos: <strong class="c-num" id="c-num">4</strong></p>
    </section>

    <!-- Grid de productos -->
    <section class="menu-grid" id="menu-grid">
      <button class="item-btn" onclick="cobrar('Fresa', 1, '🍓')">
        <span class="i-emoji">🍓</span>
        <span class="i-name">Fresa</span>
        <strong class="i-cost">-1 cr</strong>
      </button>
      <button class="item-btn" onclick="cobrar('Plátano', 1, '🍌')">
        <span class="i-emoji">🍌</span>
        <span class="i-name">Plátano</span>
        <strong class="i-cost">-1 cr</strong>
      </button>
      <button class="item-btn" onclick="cobrar('Verde', 1, '🌿')">
        <span class="i-emoji">🌿</span>
        <span class="i-name">Verde</span>
        <strong class="i-cost">-1 cr</strong>
      </button>
      <button class="item-btn" onclick="cobrar('Proteína', 2, '💪')">
        <span class="i-emoji">💪</span>
        <span class="i-name">Proteína</span>
        <strong class="i-cost">-2 cr</strong>
      </button>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="../js/caja.js"></script>
</body>

</html>
